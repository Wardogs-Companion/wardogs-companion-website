version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check ne prend en charge que TypeScript 5 et 6.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      tooling:
        patterns:
          - 'prettier'
          - 'prettier-plugin-astro'
          - 'typescript'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
